syntax = "proto3";

package kvpb;

option go_package = "github.com/carissaayo/go-kv-dist/proto/kvpb";
 
service KV {
  rpc Get(GetRequest) returns (GetResponse);
  rpc Set(SetRequest) returns (SetResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
}

message GetRequest {
  string key = 1;
}

message GetResponse {
  bool found = 1;
  bytes value = 2;
}

message SetRequest {
  string key = 1;
  bytes value = 2;
}

message SetResponse {}
message DeleteRequest {
  string key = 1;
}

message DeleteResponse {}